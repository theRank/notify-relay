name: Live

# Real-provider checks; keep these non-required because provider outages are external to the PR.
# Restrict the live environment to main too, so unmerged code cannot access its secrets.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '5 5 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live

jobs:
  live:
    name: live (${{ matrix.target }})
    # workflow_dispatch can target other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ workers, docker ]
    environment: live
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build image
        if: matrix.target == 'docker'
        run: docker build --tag notify-relay:live .

      - name: Live test
        env:
          LIVE_IMAGE: ${{ matrix.target == 'docker' && 'notify-relay:live' || '' }}
          LIVE_LOKI_URL: ${{ secrets.LIVE_LOKI_URL }}
          LIVE_LOKI_USER: ${{ secrets.LIVE_LOKI_USER }}
          LIVE_LOKI_TOKEN: ${{ secrets.LIVE_LOKI_TOKEN }}
          LIVE_SMTP_HOST: ${{ secrets.LIVE_SMTP_HOST }}
          LIVE_SMTP_USER: ${{ secrets.LIVE_SMTP_USER }}
          LIVE_SMTP_PASSWORD: ${{ secrets.LIVE_SMTP_PASSWORD }}
          LIVE_SMTP_FROM: ${{ secrets.LIVE_SMTP_FROM }}
          LIVE_SMTP_TO: ${{ secrets.LIVE_SMTP_TO }}
          LIVE_GMAIL_CLIENT_ID: ${{ secrets.LIVE_GMAIL_CLIENT_ID }}
          LIVE_GMAIL_CLIENT_SECRET: ${{ secrets.LIVE_GMAIL_CLIENT_SECRET }}
          LIVE_GMAIL_REFRESH_TOKEN: ${{ secrets.LIVE_GMAIL_REFRESH_TOKEN }}
          LIVE_GMAIL_FROM: ${{ secrets.LIVE_GMAIL_FROM }}
          LIVE_GMAIL_TO: ${{ secrets.LIVE_GMAIL_TO }}
          LIVE_IMAP_HOST: ${{ secrets.LIVE_IMAP_HOST }}
          LIVE_IMAP_USER: ${{ secrets.LIVE_IMAP_USER }}
          LIVE_IMAP_PASSWORD: ${{ secrets.LIVE_IMAP_PASSWORD }}
          LIVE_BARK_KEY: ${{ secrets.LIVE_BARK_KEY }}
          LIVE_BARK_ENCRYPTION: ${{ secrets.LIVE_BARK_ENCRYPTION }}
          LIVE_BARK_ENCRYPTION_KEY: ${{ secrets.LIVE_BARK_ENCRYPTION_KEY }}
          LIVE_SLACK_URL: ${{ secrets.LIVE_SLACK_URL }}
          LIVE_DISCORD_URL: ${{ secrets.LIVE_DISCORD_URL }}
          LIVE_FEISHU_URL: ${{ secrets.LIVE_FEISHU_URL }}
          LIVE_FEISHU_SECRET: ${{ secrets.LIVE_FEISHU_SECRET }}
          LIVE_TELEGRAM_TOKEN: ${{ secrets.LIVE_TELEGRAM_TOKEN }}
          LIVE_TELEGRAM_CHAT: ${{ secrets.LIVE_TELEGRAM_CHAT }}
        run: npm run test:live
