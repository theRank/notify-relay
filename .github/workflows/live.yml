name: Live

# Sends through real channels and reads each back: Loki through its query API, ntfy through a fresh topic
# on ntfy.sh, and mail, sent through one SMTP server on 587 and 465 and through the Gmail API, over IMAP.
# With LIVE_BARK_KEY set, it also pushes through Bark, in the clear and, with LIVE_BARK_ENCRYPTION and its
# key, encrypted, which only the phone shows. It runs once on the Workers runtime and once through the
# container image. Runs on main only, after merges, weekly and by hand, so no unmerged code sees the
# secrets: a dispatch from another branch is skipped, and the `live` environment holding them admits only
# main as well. Endpoints and addresses are secrets too, so the public log masks them. Not a required
# check: a provider outage turns it red without blocking a merge.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '5 5 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live

jobs:
  live:
    name: live (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ workers, docker ]
    environment: live
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build image
        if: matrix.target == 'docker'
        run: docker build --tag notify-relay:live .

      - name: Live test
        env:
          LIVE_IMAGE: ${{ matrix.target == 'docker' && 'notify-relay:live' || '' }}
          LIVE_LOKI_URL: ${{ secrets.LIVE_LOKI_URL }}
          LIVE_LOKI_USER: ${{ secrets.LIVE_LOKI_USER }}
          LIVE_LOKI_TOKEN: ${{ secrets.LIVE_LOKI_TOKEN }}
          LIVE_SMTP_HOST: ${{ secrets.LIVE_SMTP_HOST }}
          LIVE_SMTP_USER: ${{ secrets.LIVE_SMTP_USER }}
          LIVE_SMTP_PASSWORD: ${{ secrets.LIVE_SMTP_PASSWORD }}
          LIVE_SMTP_FROM: ${{ secrets.LIVE_SMTP_FROM }}
          LIVE_SMTP_TO: ${{ secrets.LIVE_SMTP_TO }}
          LIVE_GMAIL_CLIENT_ID: ${{ secrets.LIVE_GMAIL_CLIENT_ID }}
          LIVE_GMAIL_CLIENT_SECRET: ${{ secrets.LIVE_GMAIL_CLIENT_SECRET }}
          LIVE_GMAIL_REFRESH_TOKEN: ${{ secrets.LIVE_GMAIL_REFRESH_TOKEN }}
          LIVE_GMAIL_FROM: ${{ secrets.LIVE_GMAIL_FROM }}
          LIVE_GMAIL_TO: ${{ secrets.LIVE_GMAIL_TO }}
          LIVE_IMAP_HOST: ${{ secrets.LIVE_IMAP_HOST }}
          LIVE_IMAP_USER: ${{ secrets.LIVE_IMAP_USER }}
          LIVE_IMAP_PASSWORD: ${{ secrets.LIVE_IMAP_PASSWORD }}
          LIVE_BARK_KEY: ${{ secrets.LIVE_BARK_KEY }}
          LIVE_BARK_ENCRYPTION: ${{ secrets.LIVE_BARK_ENCRYPTION }}
          LIVE_BARK_ENCRYPTION_KEY: ${{ secrets.LIVE_BARK_ENCRYPTION_KEY }}
        run: npm run test:live
